<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Tienda</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Mini Tienda</h1>
  </header>

  <main>
    <section class="card">
      <div class="section-header">
        <h2>Productos disponibles</h2>
        <button id="btn-toggle-form" type="button">+ Registrar producto</button>
      </div>

      <form id="form-registrar" class="hidden">
        <div class="campo">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" required />
        </div>
        <div class="campo">
          <label for="precio">Precio *</label>
          <input type="number" id="precio" step="0.01" min="0.01" required />
        </div>
        <div class="campo">
          <label for="stock">Stock</label>
          <input type="number" id="stock" min="0" value="0" />
        </div>
        <button type="submit">Guardar producto</button>
        <p id="mensaje-registrar" class="mensaje"></p>
      </form>

      <div id="lista-productos" class="lista-productos"></div>
    </section>

    <section class="card">
      <h2>Carrito</h2>
      <div id="lista-carrito" class="lista-carrito"></div>
      <div class="carrito-total">
        <strong>Total: $<span id="total-carrito">0.00</span></strong>
      </div>
      <button id="btn-finalizar" type="button">Finalizar compra</button>
      <p id="mensaje-carrito" class="mensaje"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
